<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistik</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<main>
<h1>Statistik</h1>
<div class="sub" id="state">Lade ...</div>
<div class="tabs"><button data-h="24" class="on">24 Stunden</button><button data-h="168">7 Tage</button></div>
<h2>Spieler online</h2>
<div class="chart"><svg id="c1" viewBox="0 0 800 220" width="100%"></svg></div>
<h2>TPS (20 ist perfekt)</h2>
<div class="chart"><svg id="c2" viewBox="0 0 800 220" width="100%"></svg></div>
<h2>Höchste Spielerzahl pro Tag</h2>
<div class="chart"><svg id="c3" viewBox="0 0 800 220" width="100%"></svg></div>
</main>
<script src="nav.js"></script>
<script>
var hist=[],hours=24;
function line(svg,pts,ymin,ymax,color){
  var W=800,H=220,L=40,R=10,T=10,B=26;
  if(!pts.length){svg.innerHTML="<text x='20' y='40' fill='#9aa0a6'>Noch keine Daten.</text>";return}
  var t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;if(t1===t0)t1=t0+1;
  function X(t){return L+(t-t0)/(t1-t0)*(W-L-R)}
  function Y(v){return T+(1-(v-ymin)/(ymax-ymin))*(H-T-B)}
  var g="";
  for(var i=0;i<=4;i++){var v=ymin+(ymax-ymin)*i/4,y=Y(v);g+="<line x1='"+L+"' x2='"+(W-R)+"' y1='"+y+"' y2='"+y+"' stroke='rgba(128,128,128,.25)'/><text x='4' y='"+(y+4)+"' fill='#9aa0a6' font-size='11'>"+(Math.round(v*10)/10)+"</text>"}
  var d=pts.map(function(p,i){return (i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.v).toFixed(1)}).join(" ");
  var a=new Date(t0),b=new Date(t1);
  function fmt(x){return x.toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
  g+="<path d='"+d+"' fill='none' stroke='"+color+"' stroke-width='2'/><text x='"+L+"' y='"+(H-6)+"' fill='#9aa0a6' font-size='11'>"+fmt(a)+"</text><text x='"+(W-R)+"' y='"+(H-6)+"' fill='#9aa0a6' font-size='11' text-anchor='end'>"+fmt(b)+"</text>";
  svg.innerHTML=g;
}
function bars(svg,items){
  var W=800,H=220,L=30,B=30,T=14;
  if(!items.length){svg.innerHTML="<text x='20' y='40' fill='#9aa0a6'>Noch keine Daten.</text>";return}
  var max=Math.max.apply(null,items.map(function(i){return i.v}).concat([1]));
  var bw=(W-L-10)/items.length,g="";
  items.forEach(function(it,i){var h=(it.v/max)*(H-T-B),x=L+i*bw+4;g+="<rect x='"+x+"' y='"+(H-B-h)+"' width='"+(bw-8)+"' height='"+h+"' fill='#60a5fa' rx='3'/><text x='"+(x+(bw-8)/2)+"' y='"+(H-B-h-4)+"' fill='#9aa0a6' font-size='11' text-anchor='middle'>"+it.v+"</text><text x='"+(x+(bw-8)/2)+"' y='"+(H-10)+"' fill='#9aa0a6' font-size='11' text-anchor='middle'>"+esc(it.l)+"</text>"});
  svg.innerHTML=g;
}
function draw(){
  var from=Date.now()-hours*3600000;
  var s=hist.filter(function(p){return p.t>=from});
  var maxOn=Math.max.apply(null,s.map(function(p){return p.online}).concat([1]));
  line(document.getElementById("c1"),s.map(function(p){return {t:p.t,v:p.online}}),0,Math.max(2,maxOn),"#4ade80");
  line(document.getElementById("c2"),s.map(function(p){return {t:p.t,v:p.tps}}),0,20,"#facc15");
  var days={};
  hist.forEach(function(p){var d=new Date(p.t).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});days[d]=Math.max(days[d]||0,p.online)});
  bars(document.getElementById("c3"),Object.keys(days).slice(-7).map(function(k){return {l:k,v:days[k]}}));
}
getJSON("data/history.json").then(function(h){
  hist=h;
  document.getElementById("state").textContent=h.length+" Messpunkte (alle zehn Minuten, höchstens 7 Tage).";
  draw();
}).catch(function(){document.getElementById("state").textContent="Noch keine Daten."});
document.querySelector(".tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;hours=+b.dataset.h;Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(x){x.className=x===b?"on":""});draw()};
</script>
</body>
</html>
